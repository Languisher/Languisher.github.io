baseurl: "https://languisher.github.io/"
locale: "zh-CN"
title: "L1Nx's Site"
theme: "Languisher.github.io"
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents: "↩"
defaultContentLanguage: "zh"
hasCJKLanguage: true
buildFuture: true
enableRobotsTXT: true

outputs:
  home: [html, rss, json]

menu:
  main:
    - name: Github
      url: "https://github.com/Languisher"
      weight: 90
      params:
        class: [optional]

params:
  description: "大模型推理优化、计算机系统与并行计算。"
  author:
    cn: Languisher
    blog: Languisher
  logo:
    en:
      alt: L1Nx's Site
      url: /
      img: # a path to the logo
  footer: "&copy; [Languisher](/about/) {Year}"

security:
  allowContent: ['.*']

markup:
  highlight:
    codeFences: true
    noClasses: false
    lineNos: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
    endLevel: 6
