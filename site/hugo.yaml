baseurl: "https://languisher.github.io/"
locale: "zh-CN"
title: "L1Nx's Site"
theme: "Languisher.github.io"
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents: "↩"
defaultContentLanguage: "zh"
hasCJKLanguage: true

outputs:
  home: [html, rss, json]

menu:
  main:
    - name: Github
      url: "https://github.com/yihui/hugo-paged"
      weight: 10
      params:
        class: [optional]

params:
  description: "A website built through Hugo with the hugo-paged theme."
  logo:
    en:
      alt: Nan Lin's Site
      img: # a path to the logo
  footer: "&copy; [Yihui Xie](https://yihui.org) {Year}"

security:
  allowContent: ['.*']

markup:
  highlight:
    codeFences: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$']]
    renderer:
      unsafe: true
