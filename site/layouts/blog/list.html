{{ define "page-list" }}
{{ range .RegularPagesRecursive }}
<h2 class="toc-line"><a href="{{ .RelPermalink }}">{{ .Title | markdownify }}</a><span class="dots"></span><span class="page-num small"></span></h2>
<div class="meta-line small">{{ if gt (int (.Params.pin | default 0)) 0 }}<span class="pinned">置顶 · </span>{{ end }}{{ partial "meta.html" . }}</div>
<blockquote>{{ partial "summary.html" . }}</blockquote>
{{ end }}
{{ end }}
