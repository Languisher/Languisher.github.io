{{- if .IsPage -}}
{{ with .Params.author }}<span class="author">{{ . }}</span>{{ end }}
{{ if not .Date.IsZero }}<span class="date">{{ .Date.Format "2006-01-02" }}</span>{{ end }}
{{ if and .Params.migrated (gt .Lastmod.Unix .Date.Unix) }}<span class="updated"> · 更新于 {{ .Lastmod.Format "2006-01-02" }}</span>{{ end }}
{{- end -}}
